# Check of every pull request and of every push to main of this repository: deploy/ci/gitops-check.sh of the code
# repository (https://github.com/anhnvcoder/svp-backend), at the commit CHECKER_COMMIT below, on this tree. The
# logic is that script's alone, so it runs the same on a machine against a clone; a pull request here cannot change
# what checks it except by changing this file, which has a code owner. Job gitops-ok is the only check of this workflow
# the ruleset of main requires, so the jobs before it can be renamed or added without touching the ruleset.
#
# The repository is public and a pull request from a fork runs this workflow with the fork's tree, so:
# - no pull_request_target and no workflow_run: a pull request never runs with a write token or with secrets;
# - every job reads only: contents (the checkouts); no job has a secret (job zizmor hands its read-only GITHUB_TOKEN to
#   zizmor, which reads public data with it), and job diff-preview reads both repositories and the chart repositories
#   anonymously;
# - every action is GitHub's own and pinned to a full commit SHA: a tag moved to other code changes nothing here;
# - checkout never leaves the token in .git/config (persist-credentials: false);
# - values an outsider controls (branch names, titles) never go into a script through ${{ }}: only through env.
name: check

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand on any branch. No paths filter on any trigger: a required check whose workflow does not run is never
  # reported and leaves the pull request waiting.
  workflow_dispatch:

permissions: {}

concurrency:
  group: check-${{ github.ref }}
  # A new push to a pull request makes its previous run useless; on main a running run is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # zizmor from its official image pinned by digest (multi-arch: the same reference on an arm64 machine and an amd64
  # runner), run with docker rather than as a third-party action: every action of this workflow is GitHub's own.
  # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
  # The commit of the code repository whose deploy/ci/gitops-check.sh checks this tree: a commit on its main, changed
  # by a pull request here (Renovate proposes the newest).
  # renovate: datasource=git-refs depName=https://github.com/anhnvcoder/svp-backend branch=main
  CHECKER_COMMIT: 6be8f25d87d5613c26de468809f6f7affebcf67f

jobs:
  # Which areas a pull request changes, so a job whose area it leaves alone skips and gitops-ok accepts that skip.
  # Each output is true or false:
  #   code       any file but documentation (Markdown, LICENSE): jobs gitops, diff-preview;
  #   workflows  .github/: job zizmor.
  # docs always runs. A change of the Makefile or of this workflow, a push and a dispatch turn every output true: when
  # in doubt, run. The list comes from GitHub's API for the pull request, not from git, so no history is fetched.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      workflows: ${{ steps.files.outputs.workflows }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # Both names of a renamed file. The API lists at most 3000 files of a pull request: a list shorter than the
            # pull request's count of changed files is incomplete, and then every job runs.
            listed=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | [.filename, (.previous_filename // "")] | @tsv')
            count=$(printf '%s\n' "$listed" | grep -c . || true)
            if [ "$count" -eq "$CHANGED" ]; then
              files=$(printf '%s\n' "$listed" | tr '\t' '\n' | grep -v '^$' || true)
            else
              echo "::notice::the API listed $count of the $CHANGED changed files: every job runs"
              files=Makefile
            fi
          else
            files=Makefile
          fi
          printf '%s\n' "$files"
          # any REGEX [EXCLUDE]: true when a file matches REGEX and not EXCLUDE.
          any() {
            if printf '%s\n' "$files" | grep -E -- "$1" | grep -v -E -e "${2:-^$}" | grep -q .; then echo true; else echo false; fi
          }
          {
            if [ "$(any '^Makefile$|^\.github/workflows/check\.yml$')" = true ]; then
              printf '%s=true\n' code workflows
            else
              echo "code=$(any '.' '^LICENSE$|\.md$')"
              echo "workflows=$(any '^\.github/')"
            fi
          } | tee -a "$GITHUB_OUTPUT"

  # Renders every environment on amd64 and arm64 nodes with the charts of the code repository at the commit each
  # environment pins, checks the rules of the tree, the digests of every third-party image, and the signature,
  # attestations and provenance of every release image that changed.
  gitops:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The whole history of both: the base commit below and the revisions of envs/*/charts.yaml (each on main of the
      # code repository) are read from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitops
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anhnvcoder/svp-backend
          ref: ${{ env.CHECKER_COMMIT }}
          path: code
          fetch-depth: 0
          persist-credentials: false
      - name: The commit of the checker
        run: git -C code log -1 --format='code repository at %H (%s)'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: code/go.mod
          cache-dependency-path: code/go.sum
      # Helm at the version and checksum the code repository pins (buf comes with it, unused here).
      - run: make -C code ci-tools
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Base of the comparison: a pull request, the merge base with its base branch; a push to main, main as it was
      # before the push (all zeros when the branch did not exist: every image file is checked); a manual run, every
      # image file.
      - name: gitops-check.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base=$(git -C gitops merge-base HEAD "origin/$GITHUB_BASE_REF") ;;
            push) base=${BEFORE//0/} && base=${base:+$BEFORE} ;;
            *) base= ;;
          esac
          echo "base: ${base:-none, every image file}"
          code/deploy/ci/gitops-check.sh gitops "$base"

  # Security lint of the workflows (ADR-0041 (g)): zizmor with the regular persona on the whole repository, mounted
  # read-only, as the code repositories run it (make zizmor there). Every finding fails (exit codes 11 to 14) and shows
  # as an annotation; the deliberate ones are left out in .github/zizmor.yml, each with its reason. The job's read-only
  # GITHUB_TOKEN turns on the online audits (impostor commits, actions with known vulnerabilities). No condition:
  # gitops-ok is red when this job is red or skipped, on the pull requests of the bots too.
  zizmor:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env=GH_TOKEN -v "$PWD:/src:ro" --workdir /src "$ZIZMOR_IMAGE" \
            --persona=regular --no-progress --color=never --cache-dir /tmp/zizmor --format=github .

  # Static check of the Markdown (make docs-check): markdownlint-cli2 and lychee --offline, from the images the Makefile
  # pins by digest, run with docker on the runner and without network.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make docs-check

  # A preview, not a check: what the Applications of a pull request render to, next to what main renders, with Argo CD
  # itself (argocd-diff-preview), as a diff per Application in the job's summary. Outside gitops-ok, so it never blocks
  # a merge, and it comments nothing on the pull request (that would need a write token). It runs only for a pull
  # request: a push to main has nothing to compare with.
  #
  # The root here is a Helm chart (argocd/apps), not Application manifests in files, so the job renders the root of
  # each environment on each platform the key platforms of components.json lists, for both sides (the merge commit and
  # its first parent, the base it was merged onto), on amd64 nodes (architecture changes only the traffic router plugin
  # of Argo Rollouts), with the same values the bootstrap sets: env, platform, nodeArch, and on eks cluster from the
  # fixture of the checker commit. Each Application gets its environment and platform in front of its name
  # (stg-k3d-gateway): the three roots make Applications of one name, which the tool would otherwise number in the
  # order of the files. The tool then creates a kind cluster through the runner's docker, installs Argo CD from the
  # chart and version argocd/bootstrap.json pins, points every source of this repository (the values, ref values) at
  # the side's commit, leaves the chart sources (upstream charts, the code repository at each revision) as they are,
  # and asks Argo CD for the manifests. Every repository is public and read anonymously, as on a cluster.
  diff-preview:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # argocd-diff-preview from its official image pinned by digest, run with docker: every action of this workflow
      # is GitHub's own.
      # renovate: datasource=docker depName=dagandersen/argocd-diff-preview
      ARGOCD_DIFF_PREVIEW_IMAGE: dagandersen/argocd-diff-preview:v0.2.17@sha256:ea90848df29337b50d5058330210b38e39232360b78d9c60951fc92e454c6941
    steps:
      # The merge commit of the pull request and its first parent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitops
          fetch-depth: 2
          persist-credentials: false
      # The checker commit: its Makefile pins Helm and yq, its deploy/ci/cluster-values.example.yaml is the value
      # cluster of the platform eks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anhnvcoder/svp-backend
          ref: ${{ env.CHECKER_COMMIT }}
          path: code
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: code/go.mod
          cache-dependency-path: code/go.sum
      - run: make -C code ci-tools
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # preview/base-branch and preview/target-branch, the folders the tool reads: one file per environment and
      # platform, <env>-<platform>.yaml, the root's Applications renamed with yq of the checker's Makefile.
      - name: Render the root for both sides
        id: render
        run: |
          set -euo pipefail
          yq_image=$(sed -n 's/^YQ_IMAGE[[:space:]]*:=[[:space:]]*//p' code/Makefile)
          [[ $yq_image == *@sha256:* ]] || { echo "::error::YQ_IMAGE is not pinned by digest in the checker's Makefile"; exit 1; }
          mkdir gitops-base
          git -C gitops archive HEAD^1 | tar -x -C gitops-base
          { echo 'cluster:'; sed 's/^/  /' code/deploy/ci/cluster-values.example.yaml; } >cluster.yaml
          render() { # TREE FOLDER
            local tree=$1 out=$2 target targets env plat args
            mkdir -p "$out"
            # Read first: a jq failure inside the list of a for loop would not stop the step under set -e.
            targets=$(jq -er '.platforms | to_entries[] | .key as $p | .value.envs[] | "\(.):\($p)"' \
              "$tree/argocd/apps/components.json")
            for target in $targets; do
              [[ $target =~ ^[a-z0-9-]+:[a-z0-9-]+$ ]] ||
                { echo "::error::$tree: key platforms of components.json names '$target'"; exit 1; }
              env=${target%%:*} plat=${target#*:}
              args=(--namespace argocd --set-string "env=$env" --set nodeArch=amd64 --set-string "platform=$plat")
              [ "$plat" != eks ] || args+=(-f cluster.yaml)
              helm template svp-root "$tree/argocd/apps" "${args[@]}" >root.yaml 2>err || {
                grep -v 'found symbolic link in path' err >&2
                echo "::error::helm template of argocd/apps ($tree) for $env on $plat"
                exit 1
              }
              docker run --rm -i --network none -e "PREFIX=$env-$plat" "$yq_image" \
                'with(select(.kind == "Application"); .metadata.name = strenv(PREFIX) + "-" + .metadata.name)' \
                <root.yaml >"$out/$env-$plat.yaml"
              echo "$out/$env-$plat.yaml: $(grep -c '^kind: Application$' "$out/$env-$plat.yaml") Applications"
            done
          }
          render gitops-base preview/base-branch
          render gitops preview/target-branch
          echo "base=$(git -C gitops rev-parse HEAD^1)" >>"$GITHUB_OUTPUT"
      # The base side reads this repository at the first parent (a commit of the base branch), the pull request's side
      # at refs/pull/<number>/merge, the ref GitHub keeps for it (also for a pull request from a fork).
      - name: argocd-diff-preview
        env:
          BASE: ${{ steps.render.outputs.base }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          mkdir -p preview/output
          docker run --rm --network=host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/preview/base-branch:/base-branch:ro" \
            -v "$PWD/preview/target-branch:/target-branch:ro" \
            -v "$PWD/preview/output:/output" \
            -e REPO="$GITHUB_REPOSITORY" \
            -e BASE_BRANCH="$BASE" \
            -e TARGET_BRANCH="refs/pull/$PR_NUMBER/merge" \
            -e ARGOCD_CHART_URL="$(jq -r .repo gitops/argocd/bootstrap.json)" \
            -e ARGOCD_CHART_VERSION="$(jq -r .version gitops/argocd/bootstrap.json)" \
            -e OUTPUT_FOLDER=/output \
            -e TIMEOUT=900 \
            -e TITLE="Argo CD diff preview (<env>-<platform>-<component>, amd64 nodes)" \
            "$ARGOCD_DIFF_PREVIEW_IMAGE"
      # The tool's own title heads its diff; without a diff the summary says which step to read.
      - name: Summary
        if: always()
        run: |
          if [ -s preview/output/diff.md ]; then
            cat preview/output/diff.md >>"$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Argo CD diff preview'
              echo
              echo 'No diff: the argocd-diff-preview step did not finish. Read the log of that step.'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

  gitops-ok:
    needs: [changes, gitops, zizmor, docs]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Every check job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          # A skip is accepted only where job changes found the job's area untouched; any other skip is red.
          jq -e '
            .changes as $changes
            | {"gitops": "code", "zizmor": "workflows"} as $area
            | def skip_ok: $changes.result == "success" and $area[.key] != null and $changes.outputs[$area[.key]] == "false";
            length == 4 and all(to_entries[]; .value.result == "success" or (.value.result == "skipped" and skip_ok))
          ' <<< "$NEEDS" > /dev/null
