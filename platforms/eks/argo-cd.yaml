# Platform eks: the ApplicationSet controller and Argo CD Notifications on, read after base/argo-cd.yaml by the
# bootstrap of an EKS cluster. Only a cluster that lives for the whole session reports: the runner's k3d clusters keep
# the base's notifications off, so they write no status on commits.
# Design notes: docs/components.md.

# The ApplicationSet controller runs the one ApplicationSet of the bootstrap, svp-bootstrap, which makes root
# Application svp-root from the cluster's Secret in namespace argocd. The base leaves the controller at zero replicas.
applicationSet:
  replicas: 1

# What reports is the root Application svp-root alone: it is Healthy only once every wave of its children has synced and
# is Healthy, so one commit status argocd/<env> per commit of svp-gitops says whether the whole environment came up. The
# bootstrap labels the root svp.io/notify=root, which the subscription below selects.

# Credentials come from Secret argocd-notifications-secret, built by External Secrets: GitHub App svp-argocd-notifier
# (Commit statuses read and write on svp-gitops only, nothing else) and the Telegram bot of Alertmanager, whose chat is
# no value of this public repository: the bootstrap adds it when one is set, else only the commit status is sent. No
# argocdUrl: the server is a ClusterIP Service behind a port-forward, so a status has no link.
notifications:
  enabled: true
  secret:
    create: false
  notifiers:
    service.github: |
      appID: $github-appID
      installationID: $github-installationID
      privateKey: $github-privateKey
    service.telegram: |
      token: $telegram-token
  # Each template holds the commit status (github) and the message (telegram); a service reads only its own part.
  # The root has one source, svp-gitops at the branch it follows, so the default repoURL of a status is right; its
  # revision is the commit being synced (operation) while running, then the one the sync applied.
  templates:
    template.svp-sync-running: |
      github:
        revisionPath: "{{.app.status.operationState.operation.sync.revision}}"
        status:
          state: pending
          label: "argocd/{{.app.spec.source.helm.valuesObject.env}}"
    template.svp-deployed: |
      message: "{{.app.spec.source.helm.valuesObject.env}}: Argo CD deployed {{.app.status.operationState.syncResult.revision | trunc 12}} of svp-gitops, every Application Healthy."
      github:
        status:
          state: success
          label: "argocd/{{.app.spec.source.helm.valuesObject.env}}"
    template.svp-sync-failed: |
      message: "{{.app.spec.source.helm.valuesObject.env}}: Argo CD sync {{.app.status.operationState.phase}} at {{.app.status.operationState.syncResult.revision | trunc 12}} of svp-gitops: {{.app.status.operationState.message}}"
      github:
        status:
          state: failure
          label: "argocd/{{.app.spec.source.helm.valuesObject.env}}"
    template.svp-degraded: |
      message: "{{.app.spec.source.helm.valuesObject.env}}: Argo CD reports the root Degraded at {{.app.status.sync.revision | trunc 12}} of svp-gitops: an Application below it is not Healthy (runbook argocd-application-degraded)."
      github:
        revisionPath: "{{.app.status.sync.revision}}"
        status:
          state: failure
          label: "argocd/{{.app.spec.source.helm.valuesObject.env}}"
  # Once per revision, so a resync of the same commit does not write the status or send the message again.
  triggers:
    trigger.on-sync-running: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Running']
        oncePer: app.status.operationState.operation.sync.revision
        send: [svp-sync-running]
    trigger.on-deployed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
        oncePer: app.status.operationState.syncResult.revision
        send: [svp-deployed]
    trigger.on-sync-failed: |
      - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        oncePer: app.status.operationState.syncResult.revision
        send: [svp-sync-failed]
    trigger.on-health-degraded: |
      - when: app.status.health.status == 'Degraded'
        oncePer: app.status.sync.revision
        send: [svp-degraded]
  subscriptions:
    - recipients:
        - github
      triggers:
        - on-sync-running
        - on-deployed
        - on-sync-failed
        - on-health-degraded
      selector: svp.io/notify=root
