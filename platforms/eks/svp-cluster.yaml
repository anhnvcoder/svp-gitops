# Platform eks: Postgres on Amazon RDS and objects on Amazon S3 (no CloudNativePG, no object store in the cluster), the
# EBS volumes of StorageClass gp3 as the default class, certificates from Let's Encrypt (DNS-01 on Route 53), an
# internet-facing NLB of AWS Load Balancer Controller in front of Envoy, the API server on 443. What depends on the
# cluster (its VPC, service range, names, zone) comes from svp-cluster.values.tpl beside this file.
cloudnativePG:
  enabled: false
s3:
  mode: external
# EKS has no default StorageClass and the EBS CSI driver makes none; the PersistentVolumeClaims that name no class get
# this one, and those base/ pins to k3s's local-path name it in the files of this platform.
storageClass:
  enabled: true

# The API server listens on 443 of the control plane's network interfaces in the VPC (nodeSubnet, from the template).
kubeAPIPort: 443
# No VXLAN on EKS: the VPC CNI gives pods addresses of the VPC, and the API server's webhook calls come from the control
# plane's interfaces there, inside nodeSubnet.
kyverno:
  vxlanAddresses: []

# The namespaces of the platform charts that run here, made before their chart with Pod Security "restricted": the
# base's without cnpg-system (no CloudNativePG on EKS), with external-dns (component external-dns). A list replaces the
# base's whole, so every one is named. AWS Load Balancer Controller runs in kube-system, which this chart never labels.
platformNamespaces:
  - name: argo-rollouts
  - name: keda
  - name: kyverno
  - name: reloader
  - name: external-dns

# Let's Encrypt production: smoke tests, k6 and browsers trust no staging certificate. The account's email and the
# zone come from the template.
tls:
  issuer: acme
  acme:
    server: production

envoy:
  service:
    # AWS Load Balancer Controller makes an internet-facing NLB for this Service: target type ip (straight to the Envoy
    # pods' addresses), and the client's address kept, which the gateway's rate limits and logs key on (one trusted
    # hop, Envoy's).
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
      # Envoy's readiness endpoint instead of a TCP connect to 10443: /ready fails as soon as Envoy starts draining, so
      # the NLB stops sending new connections to a pod that is shutting down.
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "19003"
      service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /ready
  # The Envoy pods face the internet here: their HTTPS port from everywhere, metrics from svp-obs, the health check port
  # from the VPC (healthCheckCIDR, from the template).
  networkPolicy:
    enabled: true

# The Secrets come from AWS Secrets Manager through External Secrets Operator, entry svp/<env>/<entry>, written by `make
# eks-secrets`. Each namespace's store assumes a role of its own, allowed GetSecretValue on the entries that namespace
# reads, with the controller's EKS Pod Identity; the chart then lets the controller out to public addresses on 443 and
# to the Pod Identity agent. Prefix, region and roles come from svp-cluster.values.tpl beside this file.
externalSecrets:
  enabled: true
  store: aws
  argocdNotifications: true
  # Kafka is Amazon MSK and Valkey Amazon ElastiCache, whose users Terraform makes and whose certificates chain to a
  # public CA: none of the Secrets only an in-cluster broker and Valkey need (the users the init Job creates, the ACL
  # file, the local CA and its server certificates).
  localKafkaValkey: false

# The nodes of every workload come from Karpenter (component karpenter): NodePool and EC2NodeClass default, Graviton,
# the pinned AL2023 release of the system node group. The values here are production's; envs/stg/svp-cluster.yaml
# only lowers capacity type, limits and disruption. The cluster's name comes from svp-cluster.values.tpl beside this
# file.
karpenter:
  enabled: true
  amiAlias: al2023@v20261107
  # On-demand, a ceiling with room for the load step of the reliability targets, and one node replaced at a time, so
  # consolidation and drift never take more than one node's pods.
  capacityTypes: [on-demand]
  limits:
    cpu: 32
    memory: 128Gi
  disruptionBudgets:
    - nodes: "1"
  # The same ceiling in every environment: a node drains for at most this long, then Karpenter deletes it even while a
  # PodDisruptionBudget blocks an eviction, so the teardown before terraform destroy always ends.
  terminationGracePeriod: 10m

