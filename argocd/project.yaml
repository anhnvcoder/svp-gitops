# AppProject svp: what the Applications of the GitOps path may read and where they may write. Applied by the bootstrap
# before root Application svp-root, which belongs to it. Anything outside these lists is refused by Argo CD before it
# reaches the cluster, whatever a chart or a values file in git asks for. AppProject default, emptied, follows.
# Design notes: docs/components.md.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: svp
  namespace: argocd
spec:
  description: Short-video platform on a lab k3d cluster or on Amazon EKS
  # This repository and the code repository (its charts, read only at the commit envs/<env>/charts.yaml pins), over
  # HTTPS without credentials as repoURL and chartRepoURL of argocd/apps/values.yaml name them, and the chart
  # repositories of components.json, nothing else. docker.io/envoyproxy (Envoy Gateway) and ghcr.io/stakater/charts
  # (Reloader) are OCI repositories, written without the scheme as Argo CD takes them.
  sourceRepos:
    - https://github.com/anhnvcoder/svp-gitops.git
    - https://github.com/anhnvcoder/svp-backend.git
    - https://charts.jetstack.io
    - docker.io/envoyproxy
    - ghcr.io/stakater/charts
    - https://cloudnative-pg.github.io/charts
    - https://charts.redpanda.com
    - https://kedacore.github.io/charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://argoproj.github.io/argo-helm
    - https://kyverno.github.io/kyverno/
    - https://charts.external-secrets.io
    # Platform eks only: AWS Load Balancer Controller, ExternalDNS.
    - https://aws.github.io/eks-charts
    - https://kubernetes-sigs.github.io/external-dns/
  # The project's namespaces and those of the platform charts, on this cluster only. kube-system only because KEDA's
  # chart puts RoleBinding keda-operator-auth-reader there, bound to a Role that exists in kube-system alone (without it
  # Application keda never syncs), and on platform eks for AWS Load Balancer Controller. svp-secrets holds the source
  # Secrets the stores read on a lab cluster; reloader's Roles and RoleBindings go into listed namespaces.
  destinations:
    - {server: https://kubernetes.default.svc, namespace: svp}
    - {server: https://kubernetes.default.svc, namespace: svp-data}
    - {server: https://kubernetes.default.svc, namespace: svp-obs}
    - {server: https://kubernetes.default.svc, namespace: svp-edge}
    - {server: https://kubernetes.default.svc, namespace: cert-manager}
    - {server: https://kubernetes.default.svc, namespace: envoy-gateway-system}
    - {server: https://kubernetes.default.svc, namespace: cnpg-system}
    - {server: https://kubernetes.default.svc, namespace: keda}
    - {server: https://kubernetes.default.svc, namespace: argo-rollouts}
    - {server: https://kubernetes.default.svc, namespace: kyverno}
    - {server: https://kubernetes.default.svc, namespace: argocd}
    - {server: https://kubernetes.default.svc, namespace: kube-system}
    - {server: https://kubernetes.default.svc, namespace: external-secrets}
    - {server: https://kubernetes.default.svc, namespace: svp-secrets}
    - {server: https://kubernetes.default.svc, namespace: external-dns}
    - {server: https://kubernetes.default.svc, namespace: reloader}
  # Cluster-scoped kinds the charts render (helm template of every component with its values, on each platform), nothing
  # else: no PersistentVolume, PriorityClass, IngressClass, node or admission policy of another kind. Namespaced kinds
  # are not listed: every one is allowed in the namespaces above. Reloader, which watches the project's namespaces only,
  # renders none; AWS Load Balancer Controller and ExternalDNS (platform eks) need none beyond CRDs, RBAC and webhooks.
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    # Envoy Gateway's chart: safe-upgrades.gateway.networking.k8s.io, which refuses an older Gateway API CRD over a
    # newer one. Chart svp-cluster: svp-cnpg-operator-secrets (keeps the CloudNativePG operator's Secret writes in
    # cnpg-system to its own two Secrets), svp-external-secrets-writes (keeps External Secrets Operator's Secret writes
    # to the namespaces of its ExternalSecrets) and, in stg, svp-store-serviceaccount-pods and -tokens.
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicy}
    - {group: admissionregistration.k8s.io, kind: ValidatingAdmissionPolicyBinding}
    # KEDA's external metrics API.
    - {group: apiregistration.k8s.io, kind: APIService}
    # Chart svp-cluster: the cluster CA's issuers (on platform eks Let's Encrypt's) and Envoy Gateway's GatewayClass.
    - {group: cert-manager.io, kind: ClusterIssuer}
    - {group: gateway.networking.k8s.io, kind: GatewayClass}
    # Chart svp-cluster on platform eks: StorageClass gp3, the cluster's default class (EBS volumes). No other chart
    # renders one.
    - {group: storage.k8s.io, kind: StorageClass}
    # Chart svp-data: KEDA's login to Redpanda, read from Secret keda/keda-kafka.
    - {group: keda.sh, kind: ClusterTriggerAuthentication}
    # Chart svp-policy: the image policy of namespace svp. Kyverno's own chart needs no kind beyond the CRDs and RBAC
    # above; the webhook configurations it registers at run time are its own, not Argo CD's.
    - {group: policies.kyverno.io, kind: ImageValidatingPolicy}
---
# AppProject default: argocd-server creates it at its start when it is missing, open to every repository, destination
# and kind, and an Application that names it (or names no project) would escape every limit of svp above. Emptied, it
# lets nothing be deployed. argocd-server creates it only when it does not exist, so this stays across restarts;
# deleting it brings the open one back at the next start.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  sourceRepos: []
  sourceNamespaces: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - {group: "*", kind: "*"}
