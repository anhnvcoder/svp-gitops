{{- /*
One Application per component of components.json, the single list the dev path of the code repository
(deploy/k8s/install.sh there) installs from too, so both paths install the same charts, versions and values in the same
order:
- the release name is the component's name, as on the dev path;
- argocd.argoproj.io/sync-wave is the component's wave, so a policy or CRD exists before what needs it. The root
  Application moves to the next wave only once every Application of this one has finished its sync, hooks included,
  and reports Healthy (the health check for Applications in base/argo-cd.yaml), as helm --wait does on the dev path;
- an upstream chart (repo + chart + version) comes from its chart repository; a chart of the code repository (path)
  from chartRepoURL at the commit envs/<env>/charts.yaml pins (revision). Both read their values files, base/ and
  platforms/, from this repository through a source with ref "values" at targetRevision, the revision this chart runs
  at, its one source of this repository: Argo CD's repo-server refuses an Application whose values files reference one
  repository at two revisions. The environment's overlay and image come in valuesObject (below). Helm OCI
  repositories are written oci://<registry>/<path> in components.json, the form helm takes; Argo CD wants them without
  the scheme;
- every targetRevision is quoted: a branch named 2026 or true, or a chart version such as 1.10, would otherwise be read
  as a number or a boolean (1.10 as 1.1), and the Application CRD wants a string;
- canaryRoute names the HTTPRoute of a release of chart svp-service with canary set in its values file (the gateway's
  api, the web client's web): such a release gets the ignoreDifferences below. The chart cannot read that values file
  from here, so the two are kept in step by hand, and the dev path refuses a release whose values set canary without a
  canaryRoute here, or the reverse;
- archValues maps a node architecture to one more values file, read after values on a cluster whose nodes run it
  (value nodeArch): Argo Rollouts' Gateway API plugin is a native binary that the controller downloads and runs, so the
  nodes of a Linux x86_64 host need another file than those of a Mac. The dev path reads the same entry;
- gitopsOnly marks a component of this path alone, which the dev path skips: External Secrets Operator, which builds
  the Secrets here from the ExternalSecrets of chart svp-cluster, where the dev path applies them from .env;
- platforms lists the platforms (value platform) a component runs on, every platform when it has none: a component of
  another platform gets no Application at all. The dev path runs k3d's components;
- a component of wave 0 gets Pod Security "restricted" on its namespace (managedNamespaceMetadata below), so none goes
  into kube-system, whose system pods (on EKS the CNI's and kube-proxy's) that would refuse: AWS Load Balancer
  Controller, which runs there, is in wave 1. On platform eks, envoy-gateway's namespace also gets the label that has
  that controller give the Envoy pods a readiness gate (below).
Nothing here names the source Secrets the bootstrap writes into namespace svp-secrets: no chart renders them, so no
Application tracks them and pruning never deletes them.
*/}}
{{- $components := (.Files.Get "components.json" | fromJson).components }}
{{- /*
The release images are built for linux/amd64 and linux/arm64 only, so no cluster of this project runs anything else;
another value is a mistake that would deploy the arm64 plugin to nodes that cannot run it.
*/}}
{{- if not (has .Values.nodeArch (list "amd64" "arm64")) }}
{{- fail (printf "nodeArch is %q: the nodes of a cluster of this project are amd64 or arm64" (toString .Values.nodeArch)) }}
{{- end }}
{{- /*
The environment's files, value envFiles, which level 1 of the root (chart argocd/root, Application svp-root) reads
from envs/<env>/ at the revision it follows and hands over, the content of each file: this chart may run at an older
commit (gitopsRevision of the environment's charts.yaml), whose envs/ is not the environment's. envs/<env>/ holds
- charts.yaml (envFiles.charts): the commit of the code repository whose charts the environment runs, and two values
  derived from that commit (the check of this repository computes them again from it): the Pod Security Standard
  version chart svp-cluster pins (podSecurityVersion of its values), for the namespaces of wave 0 below, and the
  sha256 of the Collector's config (deploy/observability/otelcol/k8s-config.yaml there). The Collector reads ConfigMap
  otel-collector-config (chart svp-observability) only when it starts, and its own chart cannot checksum a ConfigMap
  it does not render: the checksum goes into the pod template, so a changed config rolls the pod and an unchanged one
  does not. charts is therefore no component name;
- images/<name>.yaml (envFiles.images, name to content) for every release of chart svp-service: its image block
  (repository, tag, digest) and nothing else, read after the overlay. A release with no file there would run no image
  of this environment, so a missing one fails;
- an overlay <name>.yaml (envFiles.overlays, name to content) for each component (its name in components.json) whose
  values differ there from the base, and nothing but those differences, read after the base and the platform's values
  file. An overlay never holds an image
  (every environment runs images built and signed once, which images/ names), nor canary or httpRoute.name of a
  release of chart svp-service (canaryRoute below mirrors those two for every environment), nor a secret.
Level 1 checks what the files' content shows (charts.yaml's keys, YAML maps, an image file's block, an overlay of a
release that sets image, canary or httpRoute.name); this chart what needs components.json, and the form of the values
of charts.yaml. Whatever breaks these rules fails the render, so Argo CD reports a ComparisonError on the root instead
of running an environment with a file silently left out or misread. The images of the other charts are held to the
base's by the check of this repository, which renders every overlay.
*/}}
{{- $env := toString (required "env is not set: the name of a directory of envs/ (level 1 of the root sets it)" .Values.env) }}
{{- $names := dict }}
{{- range $components }}
{{- if eq .name "charts" }}
{{- fail "components.json names a component charts: envs/<env>/charts.yaml pins the code repository's charts, no component may take that name" }}
{{- end }}
{{- $_ := set $names .name .path }}
{{- end }}
{{- $envFiles := .Values.envFiles | default dict }}
{{- if not (and (kindIs "map" $envFiles) $envFiles) }}
{{- fail "envFiles is not set: level 1 of the root (chart argocd/root) reads envs/<env>/ and sets it" }}
{{- end }}
{{- $charts := get $envFiles "charts" | default dict }}
{{- range $key := list "overlays" "images" }}
{{- if not (kindIs "map" (get $envFiles $key | default dict)) }}
{{- fail (printf "envFiles.%s is no map of a file's name to its content: level 1 of the root (chart argocd/root) sets it" $key) }}
{{- end }}
{{- end }}
{{- $overlays := get $envFiles "overlays" | default dict }}
{{- range $name, $values := $overlays }}
{{- if not (hasKey $names $name) }}
{{- fail (printf "envs/%s/%s.yaml: an overlay is <name>.yaml, name a component of components.json" $env $name) }}
{{- end }}
{{- if not (kindIs "map" ($values | default dict)) }}
{{- fail (printf "envs/%s/%s.yaml is no YAML map" $env $name) }}
{{- end }}
{{- end }}
{{- $chartRevision := toString (get $charts "revision" | default "") }}
{{- if not (regexMatch "^[0-9a-f]{40}$" $chartRevision) }}
{{- fail (printf "envs/%s/charts.yaml: revision is %q, the full commit (40 hex) of the code repository" $env $chartRevision) }}
{{- end }}
{{- $podSecurityVersion := toString (get $charts "podSecurityVersion" | default "") }}
{{- if not (regexMatch "^v1\\.[0-9]+$" $podSecurityVersion) }}
{{- fail (printf "envs/%s/charts.yaml: podSecurityVersion is %q, a Kubernetes version v1.<minor>" $env $podSecurityVersion) }}
{{- end }}
{{- $collectorSum := toString (get $charts "collectorConfigSha256" | default "") }}
{{- if not (regexMatch "^[0-9a-f]{64}$" $collectorSum) }}
{{- fail (printf "envs/%s/charts.yaml: collectorConfigSha256 is %q, a sha256 (64 hex)" $env $collectorSum) }}
{{- end }}
{{- /* The image of every release of chart svp-service, and nothing else under images/. */}}
{{- $images := get $envFiles "images" | default dict }}
{{- range $name, $values := $images }}
{{- if ne (get $names $name) "deploy/helm/svp-service" }}
{{- fail (printf "envs/%s/images/%s.yaml: an image file is <name>.yaml, name a release of chart svp-service in components.json" $env $name) }}
{{- end }}
{{- if not (kindIs "map" ($values | default dict)) }}
{{- fail (printf "envs/%s/images/%s.yaml is no YAML map" $env $name) }}
{{- end }}
{{- end }}
{{- range $components }}
{{- if and (eq (toString .path) "deploy/helm/svp-service") (not (hasKey $images .name)) }}
{{- fail (printf "envs/%s/images/%s.yaml is missing: every release of chart svp-service runs the image its environment names" $env .name) }}
{{- end }}
{{- end }}
{{- /*
The platform's directory. files/platforms is a symlink to platforms/: one directory per platform, k3d (the lab's
clusters) and eks (Amazon EKS), holding
- README.md: what the platform is, read by people only;
- <name>.yaml for each component (its name in components.json) whose values on every cluster of the platform differ
  from the base, and nothing but those differences, read after the base and before the environment's overlay: one
  environment runs on both platforms (stg), and its overlay keeps the last word over the platform's. The overlay's
  rules hold here: no image, canary or httpRoute.name of a release of chart svp-service;
- <name>.values.tpl for each component that needs what depends on the cluster it runs on (an AWS account, a session):
  a template, rendered here with tpl on value cluster, which the bootstrap sets from the infrastructure repository's
  output and git never holds. What it renders goes last into helm.valuesObject of the Application, after the
  environment's overlay and image (below): a template sets only what its cluster decides, which no file of an
  environment sets. Each value goes in with quote or toJson, never as raw text, so a name or an address cannot change
  the YAML around it.
- argo-cd.yaml: the platform's values of Argo CD itself, which the bootstrap installs after the values file of
  argocd/bootstrap.json (deploy/k8s/gitops.sh of the code repository on k3d, root aws/gitops/<env> of the
  infrastructure repository on EKS); no Application, so nothing here reads it.
A platform file that names no component of that platform, is no YAML map or sets cluster, a template that renders no
YAML map, an image or canary key in a service's, a cluster without a key of the contract below, all fail the render.
*/}}
{{- $platform := toString (required "platform is not set: the name of a directory of platforms/ (the bootstrap sets k3d or eks)" .Values.platform) }}
{{- $platforms := (.Files.Get "components.json" | fromJson).platforms | keys | sortAlpha }}
{{- if not (has $platform $platforms) }}
{{- fail (printf "platform is %q: the platforms are %s, one directory of platforms/ each" $platform (join ", " $platforms)) }}
{{- end }}
{{- $runs := dict }}
{{- range $components }}
{{- if hasKey . "platforms" }}
{{- $listed := .platforms }}
{{- if or (not (kindIs "slice" $listed)) (not $listed) (ne (len $listed) (len (uniq $listed))) (ne (len (uniq (concat $listed $platforms))) (len $platforms)) }}
{{- fail (printf "components.json: platforms of %s must list platforms of %s, each once (no platforms: every platform)" .name (join ", " $platforms)) }}
{{- end }}
{{- end }}
{{- if or (not (hasKey . "platforms")) (has $platform .platforms) }}
{{- $_ := set $runs .name true }}
{{- end }}
{{- end }}
{{- $platformFiles := dict }}
{{- $platformTemplates := dict }}
{{- $seen := false }}
{{- range $file, $content := .Files.Glob (printf "files/platforms/%s/*" $platform) }}
{{- $base := base $file }}
{{- $seen = true }}
{{- if and (not (hasPrefix "." $base)) (ne $base "README.md") (ne $base "argo-cd.yaml") }}
{{- $name := trimSuffix ".yaml" (trimSuffix ".values.tpl" $base) }}
{{- if or (eq $name $base) (not (hasKey $names $name)) }}
{{- fail (printf "platforms/%s/%s: a file of a platform is README.md, <name>.yaml or <name>.values.tpl, name a component of components.json" $platform $base) }}
{{- end }}
{{- if not (hasKey $runs $name) }}
{{- fail (printf "platforms/%s/%s: component %s does not run on %s (its platforms in components.json)" $platform $base $name $platform) }}
{{- end }}
{{- if hasSuffix ".values.tpl" $base }}
{{- $_ := set $platformTemplates $name (toString $content) }}
{{- else }}
{{- $values := fromYaml (toString $content) }}
{{- if hasKey $values "Error" }}
{{- fail (printf "platforms/%s/%s is not a YAML map: %s" $platform $base (get $values "Error")) }}
{{- end }}
{{- if hasKey $values "cluster" }}
{{- fail (printf "platforms/%s/%s sets cluster: what depends on the cluster comes from platforms/%s/%s.values.tpl, rendered on the value the bootstrap sets" $platform $base $platform $name) }}
{{- end }}
{{- if eq (get $names $name) "deploy/helm/svp-service" }}
{{- $route := get $values "httpRoute" }}
{{- if or (hasKey $values "image") (hasKey $values "canary") (and (kindIs "map" $route) (hasKey $route "name")) }}
{{- fail (printf "platforms/%s/%s sets image, canary or httpRoute.name: a release's image is envs/<env>/images/%s.yaml, and every platform runs the base's canary" $platform $base $name) }}
{{- end }}
{{- end }}
{{- $_ := set $platformFiles $name (printf "platforms/%s/%s" $platform $base) }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $seen }}
{{- fail (printf "platforms/%s/ is missing or empty: every platform has a directory, with a README.md at least" $platform) }}
{{- end }}
{{- /*
The contract of value cluster, the map output cluster_values of the infrastructure repository's Terraform gives, which
the templates of a platform read (README.md of this repository says what each key is for). Checked before any
template runs, so a missing key fails here with its name rather than as an empty string in a hostname or a CIDR. A key
added to the contract is added here, to that output, to the templates and to the example the check of this repository
renders with (deploy/ci/cluster-values.example.yaml of the code repository).
*/}}
{{- $cluster := .Values.cluster | default dict }}
{{- if not (kindIs "map" $cluster) }}
{{- fail "cluster is no map: the bootstrap sets it from output cluster_values of the infrastructure repository" }}
{{- end }}
{{- if $platformTemplates }}
{{- $cidr := "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$" }}
{{- $host := "^([a-z0-9]([a-z0-9-]*[a-z0-9])?\\.)+[a-z][a-z0-9-]*[a-z0-9]$" }}
{{- $shapes := dict
  "name" "^[a-z][a-z0-9-]*$"
  "region" "^[a-z]{2}(-[a-z]+)+-[0-9]+$"
  "vpcId" "^vpc-[0-9a-f]+$"
  "vpcCidr" $cidr
  "serviceCidr" "^([0-9]{1,3}\\.){3}0/(1[2-9]|2[0-4])$"
  "domain" $host
  "hostedZoneId" "^Z[0-9A-Z]+$"
  "acmeEmail" "^[^@[:space:]]+@[^@[:space:]]+$"
  "rdsAddress" $host
  "uploadsBucket" "^[a-z0-9][a-z0-9.-]+[a-z0-9]$"
  "mediaBucket" "^[a-z0-9][a-z0-9.-]+[a-z0-9]$"
  "mediaDomain" $host }}
{{- range $key := keys $shapes | sortAlpha }}
{{- $value := get $cluster $key }}
{{- if not (and (kindIs "string" $value) (regexMatch (get $shapes $key) $value)) }}
{{- fail (printf "cluster.%s is %q: want a value of the form %s, from output cluster_values of the infrastructure repository (the bootstrap sets cluster for platform %s)" $key (toString ($value | default "")) (get $shapes $key) $platform) }}
{{- end }}
{{- end }}
{{- range $key := list "dbCidrs" "s3Cidrs" }}
{{- $value := get $cluster $key }}
{{- if not (and (kindIs "slice" $value) $value) }}
{{- fail (printf "cluster.%s is not set: want a list of CIDRs, from output cluster_values of the infrastructure repository (the bootstrap sets cluster for platform %s)" $key $platform) }}
{{- end }}
{{- range $value }}
{{- if not (and (kindIs "string" .) (regexMatch $cidr .)) }}
{{- fail (printf "cluster.%s holds %q: want a list of CIDRs a.b.c.d/n" $key (toString .)) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* The IAM role the SecretStore of each namespace with ExternalSecrets assumes: exactly those five namespaces. */}}
{{- $roles := get $cluster "externalSecretsRoles" }}
{{- $roleNamespaces := list "argocd" "keda" "svp" "svp-data" "svp-obs" }}
{{- if not (and (kindIs "map" $roles) (eq (keys $roles | sortAlpha | join ",") (join "," $roleNamespaces))) }}
{{- fail (printf "cluster.externalSecretsRoles holds %s: want a map of exactly %s to the ARN of an IAM role, from output cluster_values of the infrastructure repository (the bootstrap sets cluster for platform %s)" (ternary (keys ($roles | default dict) | sortAlpha | join ", ") "nothing" (kindIs "map" $roles)) (join ", " $roleNamespaces) $platform) }}
{{- end }}
{{- range $ns := $roleNamespaces }}
{{- $arn := get $roles $ns }}
{{- if not (and (kindIs "string" $arn) (regexMatch "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$" $arn)) }}
{{- fail (printf "cluster.externalSecretsRoles.%s is %q: want the ARN of an IAM role, arn:aws:iam::<account>:role/<name>" $ns (toString ($arn | default ""))) }}
{{- end }}
{{- end }}
{{- end }}
{{- $platformObjects := dict }}
{{- range $name, $template := $platformTemplates }}
{{- $object := tpl $template $ | fromYaml }}
{{- if hasKey $object "Error" }}
{{- fail (printf "platforms/%s/%s.values.tpl does not render a YAML map: %s" $platform $name (get $object "Error")) }}
{{- end }}
{{- if eq (get $names $name) "deploy/helm/svp-service" }}
{{- $route := get $object "httpRoute" }}
{{- $set := list }}
{{- if hasKey $object "image" }}{{ $set = append $set "image" }}{{ end }}
{{- if hasKey $object "canary" }}{{ $set = append $set "canary" }}{{ end }}
{{- if and (kindIs "map" $route) (hasKey $route "name") }}{{ $set = append $set "httpRoute.name" }}{{ end }}
{{- if $set }}
{{- fail (printf "platforms/%s/%s.values.tpl renders %s for %s on %s: a release's image is envs/<env>/images/%s.yaml, and every platform runs the base's canary" $platform $name (join ", " $set) $env $platform $name) }}
{{- end }}
{{- end }}
{{- $_ := set $platformObjects $name $object }}
{{- end }}
{{- range $components }}
{{- if hasKey $runs .name }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ .wave | quote }}
  # Removing a component from components.json deletes its Application (the root prunes) and, through this finalizer,
  # what the Application had deployed; without it those workloads would keep running unmanaged.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.project }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace }}
  sources:
    {{- if .path }}
    - repoURL: {{ $.Values.chartRepoURL }}
      targetRevision: {{ $chartRevision | quote }}
      path: {{ .path }}
    {{- else }}
    - repoURL: {{ trimPrefix "oci://" .repo }}
      chart: {{ .chart }}
      targetRevision: {{ .version | quote }}
    {{- end }}
      helm:
        releaseName: {{ .name }}
        {{- /*
        The environment's overlay, then its image file, then what the platform's template renders, merged as Helm
        merges values files (a map key by key; any other value, a list too, replaced whole), on copies, since
        mustMergeOverwrite writes into its first argument. Argo CD reads valuesObject after every values file, so the
        order stays base/ < archValues < platforms/<platform>/<name>.yaml < overlay < image < the template's render.
        */}}
        {{- $object := dict }}
        {{- range $layer := list (get $overlays .name) (get $images .name) (get $platformObjects .name) }}
        {{- with $layer }}{{ $object = mustMergeOverwrite $object (deepCopy .) }}{{ end }}
        {{- end }}
        {{- with $object }}
        valuesObject:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- $platformFile := get $platformFiles .name }}
        {{- if or .values $platformFile }}
        valueFiles:
          {{- if .values }}
          - $values/{{ .values }}
          {{- with .archValues }}{{ with index . $.Values.nodeArch }}
          - $values/{{ . }}
          {{- end }}{{ end }}
          {{- end }}
          {{- with $platformFile }}
          - $values/{{ . }}
          {{- end }}
        {{- end }}
        {{- if eq .name "otel-collector" }}
        parameters:
          - name: podAnnotations.svp-config-sha256
            value: {{ $collectorSum | quote }}
            forceString: true
        {{- end }}
    {{- if or .values (get $platformFiles .name) }}
    - repoURL: {{ $.Values.repoURL }}
      targetRevision: {{ $.Values.targetRevision | quote }}
      ref: values
    {{- end }}
  {{- if .canaryRoute }}
  # Argo Rollouts writes into two objects of a release with a canary: its Gateway API plugin moves
  # the weights of the two backendRefs of the release's HTTPRoute during a canary, then puts them back to 100/0, and the
  # controller adds rollouts-pod-template-hash to the selectors of Services <release> and <release>-canary. Ignored
  # here, selfHeal does not set the weights back in the middle of a canary. RespectIgnoreDifferences also keeps the live
  # values when a sync applies these objects: Argo CD applies server-side with --force-conflicts, so without it every
  # sync of this Application (a new release digest) would strip the hash from both selectors, sending each request to
  # stable and canary pods alike until the controller sets it again, and reset the weights.
  # The price, read in controller/sync.go of Argo CD v3.5.5 (normalizeTargetResources): the live values reach the
  # applied manifest through a JSON merge patch, which replaces a list whole, so the whole spec.rules of the live route
  # is applied, not only its weights. A change of the rules in git (a match, a filter, a timeout) is therefore not
  # applied while the route exists: delete the route once no canary runs (kubectl --context k3d-svp -n {{ .namespace }}
  # delete httproute {{ .canaryRoute }}) and selfHeal creates it again from git within seconds, the release unreachable
  # meanwhile.
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .canaryRoute }}
      namespace: {{ .namespace }}
      jqPathExpressions:
        - .spec.rules[].backendRefs[].weight
    - group: ""
      kind: Service
      namespace: {{ .namespace }}
      jqPathExpressions:
        - .spec.selector["rollouts-pod-template-hash"]
  {{- end }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    {{- if eq (int .wave) 0 }}
    # Pod Security "restricted" on the namespace of a component of wave 0 (cert-manager, envoy-gateway-system,
    # external-secrets) from its chart's first pod on: Argo CD creates the namespace with these labels
    # (CreateNamespace below) in phase PreSync, ahead of every object of the chart in it, hooks included, and sets them
    # again at every sync. Chart svp-cluster
    # labels the namespaces of every later wave, but comes after these charts, whose CRDs it needs. The same labels as
    # svp-cluster's.
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: restricted
        pod-security.kubernetes.io/enforce-version: {{ $podSecurityVersion }}
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: {{ $podSecurityVersion }}
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: {{ $podSecurityVersion }}
        {{- if and (eq $platform "eks") (eq .name "envoy-gateway") }}
        # The NLB of AWS Load Balancer Controller sends to the Envoy pods' addresses (target type ip). With this label
        # the controller's pod webhook gives each new Envoy pod a readiness gate that holds until the NLB reports the
        # pod's target healthy, so a rollout of Envoy keeps the old pod until the new one takes traffic; without it the
        # old pod is deregistered while the new target is still in its first health checks, and the entry point refuses
        # connections meanwhile. The webhook (failurePolicy Ignore) gates only the pods of a target group: Envoy
        # Gateway's own controller here gets none, and a pod made while the controller is down gets none either.
        elbv2.k8s.aws/pod-readiness-gate-inject: enabled
        {{- end }}
    {{- end }}
    syncOptions:
      # A namespace no earlier wave made: wave 0's (with the labels above). Chart svp-cluster (wave 1) makes the
      # project's and the later platform charts' namespaces, which this then leaves alone (Argo CD only touches an
      # existing namespace when managedNamespaceMetadata is set).
      - CreateNamespace=true
      # Several CRDs (Envoy Gateway's httproutes, KEDA's scaledjobs, CloudNativePG's clusters) exceed the 262144-byte
      # annotation client-side apply needs.
      - ServerSideApply=true
      {{- if gt (int .wave) 0 }}
      # Kinds whose CRD an earlier wave installs are unknown at dry-run time on a new cluster.
      - SkipDryRunOnMissingResource=true
      {{- end }}
      {{- if .canaryRoute }}
      - RespectIgnoreDifferences=true
      {{- end }}
    # An automated sync that failed is not tried again for the same revision unless retries are set. On a new
    # cluster a sync can fail for a moment (a webhook of the previous wave not answering yet), and the root's next wave
    # would then wait for good.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
{{- end }}
{{- end }}
