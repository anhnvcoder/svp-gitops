# Root of the GitOps path. Every values file an Application reads (base/, platforms/<platform>/, envs/<env>/,
# envs/<env>/images/) comes from this repository at this revision, through a source with ref "values"; the charts of
# the code repository come from chartRepoURL at the commit envs/<env>/charts.yaml pins, upstream charts from the
# repositories components.json pins.
# Root Application svp-root (deploy/k8s/gitops.sh of the code repository) sets targetRevision to the revision it follows
# itself, the one whose release images the bootstrap has checked. Always a full ref (refs/heads/<branch>) or a commit:
# Argo CD resolves a short name with the first ref of that name, a tag included, so a tag named main could be deployed.
# Both repositories are public and Argo CD reads them over HTTPS without credentials: no repository Secret, no key
# anywhere. Both URLs are in sourceRepos of AppProject svp (argocd/project.yaml).
repoURL: https://github.com/anhnvcoder/svp-gitops.git
targetRevision: refs/heads/main
# The code repository, which holds the charts deploy/helm/* (path of a component in components.json).
chartRepoURL: https://github.com/anhnvcoder/short-video-platform.git
# AppProject that limits the sources, destinations and cluster-scoped kinds of every Application.
project: svp
# The architecture of the cluster's nodes, amd64 or arm64: a component of components.json with archValues gets the
# values file named there for it on top of its values (Argo Rollouts' traffic router plugin is a native binary, one
# per architecture). The bootstrap sets it from the nodes it created; arm64, the nodes of a Mac, otherwise.
nodeArch: arm64
# The environment this cluster runs, the name of a directory of envs/ (files/envs is a symlink to it): its
# charts.yaml pins the charts of the code repository, its images/ holds the image of every release of chart
# svp-service, and an Application whose component has a file <name>.yaml there reads it after its other values
# files. Required, no default: a cluster that forgot it would otherwise run another environment's settings without a
# word. The bootstrap sets stg, the only environment a lab cluster runs; prd is rendered by the check only. The dev path
# does not use this chart and reads base/ alone.
env: ""
# The platform this cluster runs on, the name of a directory of platforms/ (files/platforms is a symlink to it): k3d, a
# lab cluster, or eks, Amazon EKS. A component of components.json with a platforms field gets an Application only on the
# platforms it lists; an Application reads platforms/<platform>/<name>.yaml after its base/ values and before the
# environment's, and the values its platform's template platforms/<platform>/<name>.values.tpl renders from cluster
# below after all of them (templates/applications.yaml). Required, no default, as env: a cluster that forgot it would
# get the components and values of no platform at all. The bootstrap sets it: k3d on a lab cluster, eks on EKS.
platform: ""
# What depends on the AWS account or on one session (a VPC, a bucket, a name of the hosted zone), the map the
# infrastructure repository's Terraform outputs as cluster_values, set by the bootstrap of an EKS cluster and never
# written in git: this file sets it to nothing, and the check of this repository fails on a file that sets it. The
# templates of the platform turn it into values (the keys are listed in templates/applications.yaml and README.md).
cluster: {}
