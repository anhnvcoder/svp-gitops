# Production. Errors carry environment prd. The object store's endpoints are the cluster's (platforms/eks/, from
# value cluster). A service on the request path keeps serving through a node loss or a drain: two replicas on two
# nodes, at most one taken down at a time. A floor of policy, not a measured size, since no load test has run on stg
# yet: resources stay the base's, and the requests of every pod of prd with these floors fit the three nodes.
env:
  SENTRY_ENVIRONMENT: prd
  # Postgres connections per pod, the services' own default, set beside stg's smaller one. Every pod of the four
  # Postgres services at its most replicas, plus one more in a rollout, times this, plus a reserve, stays within 80% of
  # max_connections of prd's RDS instance. Sums: docs/explanation/capacity.md of the code repository.
  DATABASE_MAX_CONNS: "10"
replicas: 2
pdb:
  minAvailable: 1
spreadAcrossNodes: true
