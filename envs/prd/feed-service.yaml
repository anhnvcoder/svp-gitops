# Production. Errors carry environment prd. A service on the request path keeps serving through a node loss or a
# drain: the autoscaler never goes below two replicas, spread over two nodes, at most one taken down at a time. A floor
# of policy, not a measured size, since no load test has run on stg yet: the maximum and the resources stay the base's,
# and the requests of every pod of prd with these floors fit the three nodes.
env:
  SENTRY_ENVIRONMENT: prd
hpa:
  minReplicas: 2
pdb:
  minAvailable: 1
spreadAcrossNodes: true
