# Istio 1.32.0 (chart https://blob.istio.io/istio-release/charts base 1.32.0), release istio-base in namespace
# istio-system, wave 1 of argocd/apps/components.json: the CRDs of the mesh and the webhook that validates their
# objects, no pod. Its CRDs exist before the mesh policies of chart svp-service (wave 7).
# Design notes: docs/components.md.

base:
  # Fail closed: while istiod does not answer, an Istio object is refused rather than admitted unchecked. The chart
  # then renders Fail itself, so istiod only patches the webhook's caBundle (ignoreDifferences of argocd/apps).
  validationFailurePolicy: Fail
