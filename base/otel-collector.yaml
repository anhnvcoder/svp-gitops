# OpenTelemetry Collector contrib 0.162.0 (chart https://open-telemetry.github.io/opentelemetry-helm-charts
# opentelemetry-collector 0.176.0), release otel-collector in namespace svp-obs, wave 6 of argocd/apps/components.json.
# The six Go services and the web client send OTLP/gRPC to otel-collector.svp-obs:4317; the Collector scrubs and
# forwards to the platform's backends: Prometheus, Loki and Tempo on k3d, AWS's managed services on eks.

# Design notes: docs/components.md.

mode: deployment
replicaCount: 1
# Service otel-collector, the name every service's OTEL_EXPORTER_OTLP_ENDPOINT names.
fullnameOverride: otel-collector

# The image of compose's otelcol (deploy/compose/compose.yaml) and of `make otelcol-validate`, by the same index digest;
# keep the three in step. The chart renders repository:tag, so tag holds version@digest. Not the chart's own digest key:
# Renovate's helm-values manager finds a pin only as repository and tag under a key ending in "image".
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
command:
  name: otelcol-contrib

# The config is deploy/observability/otelcol/k8s-config.yaml merged with the platform's k8s-<platform>.yaml, which
# chart svp-observability (wave 5) puts in ConfigMap otel-collector-config under the key relay. Not the chart's own
# `config:`: it is deep-merged with the chart's defaults (Jaeger, Zipkin and Prometheus receivers, a debug exporter).

# Without the chart's checksum annotation nothing rolls the pod when the ConfigMap changes: deploy/k8s/install.sh passes
# the files' checksum as a pod annotation.
configMap:
  create: false
  existingName: otel-collector-config

# The Collector reads Secret otelcol-kafka (extraEnvs below) and, on k3d, the CA of Secret local-ca at its start only:
# Reloader (base/reloader.yaml) restarts it when either changes. On the pod template, which Reloader reads when the
# Deployment has no such annotation; a Secret absent on a platform (local-ca on eks) is simply never seen changing.
podAnnotations:
  secret.reloader.stakater.com/reload: otelcol-kafka,local-ca

# OTLP/gRPC only, as in compose; the chart opens OTLP/HTTP, Jaeger and Zipkin by default. No host port either: the
# chart's hostPort applies to daemonset mode only, and the Service is ClusterIP.
ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false

# Pod Security "restricted" (the namespace rejects pods that do not meet it): the image's user
# 10001, seccomp RuntimeDefault, no capability, a read-only root (the config is mounted, nothing is written).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  # The group the volume of Secret local-ca (mode 0440, below) is readable by.
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# 256 MiB as compose's mem_limit. memory_limiter in the config (deploy/observability/otelcol/k8s-config.yaml) refuses
# data on every pipeline from 144 MiB of heap (its soft limit: limit_mib 192 minus spike_limit_mib 48) and forces a GC
# from 192 MiB.

# GOMEMLIMIT 140 MiB, just under the soft limit, makes the Go runtime collect harder as its memory nears it, so garbage,
# which the limiter counts as heap until a GC frees it, is collected before it can trip the limiter.

# Not the chart's useGOMEMLIMIT: it sets 80% of the container's limit, 204 MiB, above both limits, so the runtime let
# garbage pile up past them.
useGOMEMLIMIT: false
extraEnvs:
  - name: GOMEMLIMIT
    value: 140MiB
  # Receiver kafka_metrics of the config reads the consumer groups' lag as Kafka user svp-otelcol over SASL_SSL. The
  # broker of chart svp-data and the local CA its certificate chains to (Secret local-ca, chart svp-cluster) are a lab
  # cluster's; platforms/eks/ names Amazon MSK's brokers, whose certificate chains to the system's roots.
  - name: SVP_KAFKA_OTELCOL_PASSWORD
    valueFrom:
      secretKeyRef: {name: otelcol-kafka, key: password}
  - name: SVP_OTELCOL_KAFKA_BROKERS
    value: kafka.svp-data.svc.cluster.local:9096
  - name: SVP_OTELCOL_KAFKA_CA_FILE
    value: /etc/svp-ca/ca.crt
extraVolumes:
  - name: local-ca
    secret:
      secretName: local-ca
      defaultMode: 0440
extraVolumeMounts:
  - name: local-ca
    mountPath: /etc/svp-ca
    readOnly: true
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}
