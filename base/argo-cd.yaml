# Argo CD v3.5.5 (chart https://argoproj.github.io/argo-helm argo-cd 10.10.5), release argocd in namespace argocd: the
# GitOps path, installed by the bootstrap at the version of argocd/bootstrap.json before everything else (not in
# components.json). Logins are the local admin user only; the server is a ClusterIP Service reached only through a
# port-forward on 127.0.0.1 (threat model OPS-2).

# Design notes: docs/components.md.

dex:
  # No single sign-on: the local admin user is the only login.
  enabled: false
notifications:
  enabled: false
applicationSet:
  # The chart has no switch to leave the ApplicationSet controller out; zero replicas leave it without a pod.
  # components.json already lists every Application. Platform eks runs it (argo-cd.yaml there) for the one
  # ApplicationSet of the GitOps Bridge, which makes the root.
  replicas: 0

configs:
  params:
    # Server-side diff: the default diff lacks the defaults the API server fills in, so svp-cluster, redpanda, svp-data
    # and gateway stayed OutOfSync and selfHeal synced them forever. The two root levels (argocd/root) turn it off: they
    # apply their child Applications client-side, and a server-side dry run would not see a field deleted from them.
    controller.diff.server.side: "true"
  cm:
    # Argo CD polls GitHub: a cluster on this machine cannot take GitHub's webhooks. Every 60 s with no jitter: the
    # chart's default jitter of 60 s would delay each periodic refresh by a random 0-60 s more. The repo-server caches
    # the refs for the same 60 s, so a push is seen within about 60 s, about 120 s at worst.
    timeout.reconciliation: 60s
    timeout.reconciliation.jitter: 0s
    # resource.exclusions stays the chart's default, which keeps Argo CD from watching Kyverno's report kinds: the
    # reports controller makes one per pod and policy, which no chart renders, and tracking them would cost the
    # controller RAM. A set here would replace that whole list; an exclusion of the project's own goes into
    # resourceExclusionsAdditional.

    # Since 1.8 Argo CD no longer assesses an Application's health, so an app-of-apps would start each sync wave before
    # the previous wave's operators, CRDs and databases are ready. This restores it from the Lua of
    # docs/operator-manual/health.md at v3.5.5, adding what status.health leaves out: hooks (svp-data's PostSync Job
    # pg-bootstrap) and a status that is of an older spec than the one the parent just applied.

    # Progressing: no status yet, a sync running, status of an older spec, or not Synced. Degraded: the last sync of the
    # current spec failed once the retries were spent. Otherwise its own status.health. A key absent on one side of a
    # source comparison equals a zero value (omitempty), except inside valuesObject; Lua cannot see null or tell {} from
    # [], so deploy/ci/gitops-tree-policies/envs.rego refuses both in the overlays and image files.

    # Test: argocd/root/application-health-test.sh.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "waiting for the first comparison"
      if obj.status == nil then
        return hs
      end
      local function zero(v)
        return v == nil or v == "" or v == false or v == 0 or (type(v) == "table" and next(v) == nil)
      end
      local function same(a, b, exact)
        if not exact and zero(a) and zero(b) then
          return true
        end
        if type(a) ~= "table" or type(b) ~= "table" then
          return a == b
        end
        for k, v in pairs(a) do
          if not same(v, b[k], exact or k == "valuesObject") then
            return false
          end
        end
        for k, v in pairs(b) do
          if a[k] == nil and not same(nil, v, exact or k == "valuesObject") then
            return false
          end
        end
        return true
      end
      local op = obj.status.operationState
      if op ~= nil and op.phase ~= "Succeeded" and op.phase ~= "Failed" and op.phase ~= "Error" then
        hs.message = "sync " .. tostring(op.phase) .. ": " .. (op.message or "")
        return hs
      end
      local sync = obj.status.sync
      if sync == nil or sync.comparedTo == nil then
        return hs
      end
      local spec = obj.spec or {}
      local key = "source"
      local want = {sync.revision}
      if not zero(spec.sources) then
        key = "sources"
        want = sync.revisions or {}
      end
      if not same(spec[key], sync.comparedTo[key]) then
        hs.message = "status is of an older spec." .. key .. ": waiting for the controller to compare the current one"
        return hs
      end
      if op ~= nil and op.phase ~= "Succeeded" then
        local res = op.syncResult
        local attempted = res == nil
        if res ~= nil then
          if not same(spec[key], res[key]) then
            hs.message = "the last sync (" .. op.phase .. ") was of an older spec." .. key ..
              ": waiting for a sync of the current one"
            return hs
          end
          local got = {res.revision}
          if key == "sources" then
            got = res.revisions or {}
          end
          attempted = sync.status == "Synced" or same(want, got, true)
        end
        if attempted then
          hs.status = "Degraded"
          hs.message = "sync " .. op.phase .. ": " .. (op.message or "")
          return hs
        end
      end
      if sync.status ~= "Synced" then
        hs.message = tostring(sync.status) .. ": waiting for a sync of the current revision and spec"
        return hs
      end
      hs.message = "waiting for the health of its resources"
      if obj.status.health ~= nil and obj.status.health.status ~= nil then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
      end
      return hs
    # Argo CD v3.5.5 has a health check for Prometheus but none for Alertmanager, so Application kube-prometheus-stack
    # would report Healthy while Alertmanager's pod still starts. Progressing until Available is True, not Degraded: a
    # Degraded resource fails the sync wave waiting on it, and every new Alertmanager starts with no pod ready. Degraded
    # when Reconciled is False.
    resource.customizations.health.monitoring.coreos.com_Alertmanager: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "waiting for the operator's first status"
      if obj.status == nil or obj.status.conditions == nil then
        return hs
      end
      local available = nil
      for _, c in ipairs(obj.status.conditions) do
        if c.observedGeneration ~= nil and c.observedGeneration < obj.metadata.generation then
          hs.message = c.type .. " is of generation " .. c.observedGeneration .. ", not " .. obj.metadata.generation
          return hs
        end
        if c.type == "Reconciled" and c.status == "False" then
          hs.status = "Degraded"
          hs.message = "Reconciled False: " .. (c.message or c.reason or "")
          return hs
        end
        if c.type == "Available" then
          available = c
        end
      end
      if available == nil then
        return hs
      end
      if available.status == "True" then
        hs.status = "Healthy"
        hs.message = "all instances are available"
      else
        hs.message = "Available " .. tostring(available.status) .. ": " .. (available.reason or "") .. " " ..
          (available.message or "")
      end
      return hs
    # Argo CD v3.5.5 checks only kyverno.io/Policy, so Application svp-policy (wave 3) would be Healthy as soon as its
    # ImageValidatingPolicy is applied, before Kyverno registers its webhook, and the services (wave 7) could start
    # before any pod of svp is checked. Healthy when status.conditionStatus.ready is true, otherwise Progressing, never
    # Degraded: a policy Kyverno cannot compile stays Progressing until the deadline of deploy/k8s/gitops.sh.
    resource.customizations.health.policies.kyverno.io_ImageValidatingPolicy: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "waiting for Kyverno to compile the policy and register its webhook"
      if obj.status == nil or obj.status.conditionStatus == nil then
        return hs
      end
      local cs = obj.status.conditionStatus
      if cs.ready == true then
        hs.status = "Healthy"
        hs.message = "policy ready, webhook configured"
        return hs
      end
      if cs.conditions ~= nil then
        for _, c in ipairs(cs.conditions) do
          if c.status ~= "True" then
            hs.message = tostring(c.type) .. " " .. tostring(c.status) .. ": " .. (c.message or "")
            return hs
          end
        end
      end
      return hs

# Images by digest, the chart's tags beside them: a tag can be pushed again to other content, a digest cannot. The chart
# renders repository:tag, so tag holds version@digest (pin_check of deploy/ci/gitops-check.sh fails on an image without
# one). repository is the chart's default written out: Renovate's helm-values manager finds a pin only as repository and
# tag under a key ending in "image". global.image.tag is every Argo CD component's image.
global:
  image:
    repository: quay.io/argoproj/argocd
    tag: v3.5.5@sha256:13db7b10db23283b1b36f855046602e18539a8a8204c9f6f039e8896c8897518
# The chart's Redis from Docker Hub rather than the chart's default registry (Amazon ECR Public's mirror of the same
# library/redis, same digest): anonymous pulls from ECR Public answered 429 Too Many Requests on a shared CI runner
# address for the whole install, while the Docker Hub images of the other charts pulled there.
redis:
  image:
    repository: docker.io/library/redis
    tag: 8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
