# Release feed-service of chart deploy/helm/svp-service.
# Secret feed-service-env holds DATABASE_URL (app role), the Kafka login, REDIS_URL (Valkey db 14, where the first
# explore page is cached for 5 s) and JWT_VERIFY_KEYS, the public keys that check the forwarded access token;
# feed-service-migrate-env the migrator role's DATABASE_URL.
protocol: grpc
port: 9104
migrate: true
resources:
  # Compose peaked at 82 MiB while loading 200,000 follows.
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "1", memory: 256Mi}
env:
  LISTEN_ADDR: ":9104"
  # Consumes user.follows.v1 and video.lifecycle.v1 to build the timelines on write.
  KAFKA_BROKERS: kafka.svp-data.svc.cluster.local:9096
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.svp-obs:4040
  SENTRY_ENVIRONMENT: k3d
# SENTRY_DSN from Secret sentry (errors to GlitchTip in svp-obs).
errorTracking: true
ingressFrom: [gateway]
egressTo: [postgres, kafka, valkey, collector, pyroscope, glitchtip]
# Peer kafka for a chart from before it, the revision envs/prd/charts.yaml pins until the first promote to prd is one;
# the chart's own peer kafka is the same. Drop it once prd pins a chart with peer kafka.
peers:
  kafka:
    namespace: svp-data
    labels: {app.kubernetes.io/name: kafka}
    ports: [9096]
# Two replicas always, preferably on the two nodes, so a killed or crashed pod, a node drain or an eviction leaves one
# serving the feeds while its replacement starts: with a single replica the gateway's retries (well under a second) end
# before a new pod is Ready, and the feed requests of that gap fail. The spread is a preference only (the chart's
# whenUnsatisfiable: ScheduleAnyway): both pods may still land on one node.

# The budget lets a drain take one pod at a time. The maximum stays at two, within the RAM the machine leaves for the
# cluster, so the autoscaler does not scale today; it stays for a higher maximum later, with 70% of the 100m CPU request
# as the point where it scales out.

# Risk: each gateway pod holds one long-lived HTTP/2 connection to feed-service:9104 through the ClusterIP (grpc-go's
# pick_first; kube-proxy picks the backend when the connection opens), so the load splits by connections, not by
# requests, and can be uneven between the two pods.
hpa:
  minReplicas: 2
  maxReplicas: 2
  cpuUtilization: 70
pdb:
  minAvailable: 1
spreadAcrossNodes: true
