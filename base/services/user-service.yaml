# Release user-service of chart deploy/helm/svp-service.
# Secret user-service-env holds DATABASE_URL (app role), the Kafka login and the JWT signing key, which exists in this
# Secret only (threat model JWT-10), and JWT_VERIFY_KEYS, the public keys that check the forwarded access token;
# user-service-migrate-env the migrator role's DATABASE_URL.
protocol: grpc
port: 9101
migrate: true
resources:
  # Up to 4 argon2id hashes of 64 MiB at once (threat model JWT-9), plus the runtime and the connection pool.
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "1", memory: 384Mi}
env:
  # The pod's address, so the gateway reaches it through the Service.
  LISTEN_ADDR: ":9101"
  # Follow events go out through the outbox, as user svp-user-service (SASL SCRAM-SHA-512 over TLS).
  KAFKA_BROKERS: kafka.svp-data.svc.cluster.local:9096
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.svp-obs:4040
  SENTRY_ENVIRONMENT: k3d
# SENTRY_DSN from Secret sentry (errors to GlitchTip in svp-obs).
errorTracking: true
ingressFrom: [gateway]
egressTo: [postgres, kafka, collector, pyroscope, glitchtip]
# Peer kafka for a chart from before it, the revision envs/prd/charts.yaml pins until the first promote to prd is one;
# the chart's own peer kafka is the same. Drop it once prd pins a chart with peer kafka.
peers:
  kafka:
    namespace: svp-data
    labels: {app.kubernetes.io/name: kafka}
    ports: [9096]
