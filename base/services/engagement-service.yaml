# Release engagement-service of chart deploy/helm/svp-service.
# Secret engagement-service-env holds DATABASE_URL (app role), the Kafka login and JWT_VERIFY_KEYS, the public keys that
# check the forwarded access token; engagement-service-migrate-env the migrator role's DATABASE_URL.
protocol: grpc
port: 9103
migrate: true
resources:
  requests: {cpu: 50m, memory: 32Mi}
  limits: {cpu: 500m, memory: 256Mi}
env:
  LISTEN_ADDR: ":9103"
  # Produces and consumes engagement.views.v1: views are counted in batches.
  KAFKA_BROKERS: kafka.svp-data.svc.cluster.local:9096
  # Most Postgres connections the process opens, those still being dialed included: half for GetStats, half for likes
  # and the views consumer, so GetStats calls the gateway cancels after 100 ms, whose connections pgx closes and dials
  # again, never take a connection a like needs. Set here because pgx's own default, max(4, NumCPU) per pool, changes
  # with the node.
  DATABASE_MAX_CONNS: "10"
  PYROSCOPE_SERVER_ADDRESS: http://pyroscope.svp-obs:4040
  SENTRY_ENVIRONMENT: k3d
# SENTRY_DSN from Secret sentry (errors to GlitchTip in svp-obs).
errorTracking: true
ingressFrom: [gateway]
egressTo: [postgres, kafka, collector, pyroscope, glitchtip]
# Peer kafka for a chart from before it, the revision envs/prd/charts.yaml pins until the first promote to prd is one;
# the chart's own peer kafka is the same. Drop it once prd pins a chart with peer kafka.
peers:
  kafka:
    namespace: svp-data
    labels: {app.kubernetes.io/name: kafka}
    ports: [9096]
