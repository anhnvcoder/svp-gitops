# Argo Rollouts on amd64 nodes (a Linux x86_64 host, such as a CI runner), read after argo-rollouts.yaml, which pins the
# arm64 build of the Gateway API plugin: on amd64 nodes that binary fails to start at every reconcile, so the gateway
# and the web client never get a pod. Helm replaces a list as a whole, so this list is the plugin list on such nodes.

# Argo CD (nodeArch of the root) and deploy/k8s/install.sh read this file through archValues of
# argocd/apps/components.json. The asset is of the same release as argo-rollouts.yaml's, which install.sh and `make
# helm-check` check: a new release changes both pins together.
# Design notes: docs/components.md.
controller:
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.17.0/gatewayapi-plugin-linux-amd64
      sha256: 1904ca787d33107c140521899d61fff030ee75d99908bd175fca5a4647759061
