# Argo Rollouts v1.10.1 (chart https://argoproj.github.io/argo-helm argo-rollouts 2.43.8), release argo-rollouts in
# namespace argo-rollouts, wave 2 of argocd/apps/components.json: the controller and its CRDs. The Rollouts are the
# gateway's and the web client's (chart svp-service, wave 7). The chart's pod meets Pod Security "restricted", which
# that namespace enforces: chart svp-cluster (wave 1) makes it with that label.

# Rights. The chart's default ClusterRole reads every Secret, creates Jobs in every namespace, updates every pod and
# patches every Service. Here the controller runs namespaced (clusterInstall false makes the chart pass --namespaced and
# render its rules as a Role in argo-rollouts only) and --namespace=svp below points every informer at svp, the one
# namespace with a Rollout. In svp it gets Role argo-rollouts below: what a canary needs and nothing more.

# A taken-over controller keeps, in argo-rollouts, the chart's rules, which no value of chart 2.43.8 narrows (Secrets
# there, Jobs, Deployments and pods, Services, Ingresses); Pod Security "restricted" bounds what those can start. In
# svp, ReplicaSets and the pods it lists and evicts, which reaches the Secrets of svp too, as the control plane's
# Deployment controller does. No Secret of another namespace, no route of svp but HTTPRoutes api and web.

# Upgrading: compare the controller's rules in Role argo-rollouts (namespace argo-rollouts) with the old render, check
# that the new controller still watches only what Role argo-rollouts of svp allows, and that it logs no "forbidden"
# through one canary of the gateway and one of the web client.
# Design notes: docs/components.md.

clusterInstall: false

controller:
  # One controller: the lab runs one canary at a time, and a second replica only waits for the lease (about 150 MiB).
  replicas: 1
  # By digest (multi-arch index), the chart's appVersion beside it for the reader. The chart takes version@digest in tag
  # (pin_check of deploy/ci/gitops-check.sh fails on an image without one). The plugin below is a binary pinned by its
  # sha256, not an image. registry and repository are the chart's defaults written out: without registry Renovate would
  # look the image up on Docker Hub.
  image:
    registry: quay.io
    repository: argoproj/argo-rollouts
    tag: v1.10.1@sha256:fbcc4cf0a29da25d86230992b1dfdeadf30b6f1baa74ea7c9c98e3e580769396
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  extraArgs:
    # With --namespaced (clusterInstall false) the controller watches the namespace of its kubeconfig, which this
    # override names: the Rollouts, ReplicaSets, Services, pods and analysis objects of svp.
    - --namespace=svp
  extraEnv:
    # Job metrics would otherwise run their Jobs, and watch Jobs and their pods, in the watched namespace (svp). No
    # analysis here uses a Job; the informers then watch argo-rollouts, where the chart's Role covers them.
    - name: ARGO_ROLLOUTS_ANALYSIS_JOB_NAMESPACE
      value: argo-rollouts
  # Traffic router plugin Gateway API v0.17.0, the arm64 binary (a Mac); argo-rollouts-amd64.yaml replaces this list on
  # amd64 nodes. The controller downloads it at start (namespace argo-rollouts denies no egress) and refuses a file
  # whose sha256 differs; the release publishes no checksum file, so the value was computed on the downloaded asset. It
  # runs as a child process with the controller's ServiceAccount: it gets and updates HTTPRoutes api and web.
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.17.0/gatewayapi-plugin-linux-arm64
      sha256: 5221279f7bf2c9b2c0ff6ed7ff12718ecce1d4892f1ff5e5224bb723cfd0fd92

# The providers' rules (Istio, SMI, Ambassador, ..., Gateway API) would only be added to the Role in argo-rollouts,
# which holds no route; the plugin's right on HTTPRoutes api and web is in Role argo-rollouts of svp.
providerRBAC:
  enabled: false

extraObjects:
  # What the controller does in svp, by rule. Left out of the chart's rules: Secrets, ConfigMaps, Jobs (job metrics run
  # in argo-rollouts, see extraEnv), Deployments and pod templates (no workloadRef), pod updates, creating and deleting
  # Services (experiments only), writes on Ingresses, ClusterAnalysisTemplates and every traffic provider but HTTPRoutes
  # api and web.
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: argo-rollouts
      namespace: svp
    rules:
      # The Rollout itself; finalizers so that the ReplicaSets and AnalysisRuns it owns may block its deletion.
      - apiGroups: [argoproj.io]
        resources: [rollouts, rollouts/status, rollouts/finalizers]
        verbs: [get, list, watch, update, patch]
      # Analysis: AnalysisRuns per canary from AnalysisTemplates <release>-canary and <release>-canary-gate.
      - apiGroups: [argoproj.io]
        resources: [analysisruns]
        verbs: [create, get, list, watch, update, patch, delete]
      - apiGroups: [argoproj.io]
        resources: [analysistemplates, experiments]
        verbs: [get, list, watch]
      # The stable and canary ReplicaSets.
      - apiGroups: [apps]
        resources: [replicasets]
        verbs: [create, get, list, watch, update, patch, delete]
      # Services <release> and <release>-canary (gateway, web): the controller adds rollouts-pod-template-hash to their
      # selectors.
      - apiGroups: [""]
        resources: [services]
        verbs: [get, list, watch, patch]
      # spec.restartAt (restart without a new revision) lists the Rollout's pods and evicts the old ones, through the
      # PodDisruptionBudget.
      - apiGroups: [""]
        resources: [pods]
        verbs: [list, watch]
      - apiGroups: [""]
        resources: [pods/eviction]
        verbs: [create]
      - apiGroups: [""]
        resources: [events]
        verbs: [create, update, patch]
      # The controller starts an Ingress informer whatever the traffic router, and waits for it to sync.
      - apiGroups: [networking.k8s.io]
        resources: [ingresses]
        verbs: [list, watch]
      # The plugin reads the route of each Rollout by name (api of the gateway, web of the web client) and writes the
      # weights of its two backendRefs (and a label while a canary runs) with an update.
      - apiGroups: [gateway.networking.k8s.io]
        resources: [httproutes]
        resourceNames: [api, web]
        verbs: [get, update]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: argo-rollouts
      namespace: svp
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: argo-rollouts
    subjects:
      - kind: ServiceAccount
        name: argo-rollouts
        namespace: argo-rollouts
