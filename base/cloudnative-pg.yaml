# CloudNativePG 1.30.1 (chart https://cloudnative-pg.github.io/charts cloudnative-pg 0.29.1), release cloudnative-pg in
# namespace cnpg-system, wave 2 of argocd/apps/components.json. The operator and its CRDs only; the Cluster svp-pg is in
# chart svp-data (wave 4). The chart's pod already meets Pod Security "restricted".
# Design notes: docs/components.md.

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # About 150 MiB expected at rest; without a limit a leak would only show once the node is short.
    memory: 256Mi

# By default (config.clusterWide true, rbac.create true) the chart binds the operator a ClusterRole that creates, reads
# and deletes Secrets, pods, pods/exec, Deployments, Jobs, Roles and RoleBindings in every namespace: whoever takes its
# token reads svp/user-service-env (the JWT signing key) or execs into any pod. So the operator watches svp-data, where
# its only Cluster svp-pg is, and its own namespace cnpg-system, and holds rights in those two only.

# cnpg-system is watched too: the operator finds the Barman Cloud plugin that backs up svp-pg by its Service, which must
# be in the operator's own namespace, and it sees Services only through informers of the watched namespaces. With
# svp-data alone the plugin is never loaded and svp-pg stops at "Unknown plugin: 'barman-cloud.cloudnative-pg.io'".

# The plugin runs there with a ServiceAccount that reads every Secret of the cluster, so the Role in cnpg-system reads
# the kinds the operator caches and writes only Secrets, events and its Lease. The operator writes its own PKI Secrets
# there and RBAC cannot narrow create by name: a ValidatingAdmissionPolicy keeps those writes to the two names it uses,
# so it cannot mint a token Secret for the plugin's ServiceAccount (templates/cnpg-rbac.yaml of chart svp-cluster).

# clusterWide stays true: the chart's namespaced mode binds its Role in cnpg-system only and sets WATCH_NAMESPACE to it,
# which the operator reads before its ConfigMap, so WATCH_NAMESPACE in config.data would never see svp-pg. The chart
# then sets no WATCH_NAMESPACE and the one below is the only one. rbac.create false: the chart renders no Role,
# ClusterRole or binding; chart svp-cluster renders the chart's own rules as templates/cnpg-rbac.yaml.

# A namespace added to WATCH_NAMESPACE needs a Role and a RoleBinding in that template too, or its informers fail with
# "forbidden".

# The chart's rules also grant get and patch on every MutatingWebhookConfiguration and ValidatingWebhookConfiguration:
# a stolen token could rewrite a webhook to receive every Secret written in the cluster. MANAGE_WEBHOOK_CONFIGURATIONS=
# false makes the operator leave them alone, and that rule is left out of templates/cnpg-rbac.yaml. cert-manager issues
# the webhook's certificate into Secret cnpg-webhook-cert; its cainjector writes it into both webhook configurations.

# The annotation goes in commonAnnotations (the chart puts it on the MutatingWebhookConfiguration) and rbac.annotations
# (the ValidatingWebhookConfiguration). MANAGE_WEBHOOK_CONFIGURATIONS is set in the environment beside WATCH_NAMESPACE.

# Upgrading the chart: diff its templates/_helpers.tpl, templates/rbac.yaml and webhook templates against the old
# version and take every change into templates/cnpg-rbac.yaml of chart svp-cluster.
config:
  clusterWide: true
rbac:
  create: false
  annotations:
    cert-manager.io/inject-ca-from: cnpg-system/cnpg-webhook
commonAnnotations:
  cert-manager.io/inject-ca-from: cnpg-system/cnpg-webhook
additionalEnv:
  - name: WATCH_NAMESPACE
    value: svp-data,cnpg-system
  - name: MANAGE_WEBHOOK_CONFIGURATIONS
    value: "false"

# The operator's image by digest (multi-arch index: linux/amd64 and linux/arm64), the chart's appVersion beside it for
# the reader: a tag can be pushed again to other content, a digest cannot. The chart renders repository:tag, so tag
# holds version@digest; it also goes into env OPERATOR_IMAGE_NAME, the image of the bootstrap initContainer of every
# Postgres pod. repository is the chart's default written out, which Renovate's helm-values manager needs.
image:
  repository: ghcr.io/cloudnative-pg/cloudnative-pg
  tag: 1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07
