# Reloader v1.4.23 (chart oci://ghcr.io/stakater/charts reloader 2.2.19), release reloader in namespace reloader, wave 2
# of argocd/apps/components.json: after chart svp-cluster (wave 1), which makes namespace reloader with Pod Security
# "restricted" and its NetworkPolicies (default-deny, allow-dns, allow-kube-api), and before every chart whose workloads
# opt in: KEDA, kube-prometheus-stack and Redpanda (wave 3), svp-data (wave 4), svp-observability (wave 5), the releases
# of svp-service (wave 7).
#
# It restarts a workload when a Secret the workload names changes: the credentials deploy/k8s/secrets.sh and
# deploy/k8s/aws-secrets.sh of the code repository rotate (lab: from .env; EKS: from AWS Secrets Manager through
# External Secrets), and svp/sentry when glitchtip-init.sh changes it (not when it creates it: see reloadOnCreate). A
# workload opts in by the names of its Secrets in annotation secret.reloader.stakater.com/reload, never by
# reloader.stakater.com/auto; nothing else is touched.
#
# What a taken-over controller (its ServiceAccount token) holds, all from the chart's Roles in the namespaces below and
# in reloader, no ClusterRole: get, list and watch every Secret there, which it needs to see a change and to hash the
# data; get, list, update and patch Deployments, DaemonSets, StatefulSets and Argo Rollouts there; get and list
# CronJobs, create and delete Jobs there (the chart's namespaced Role always grants them, for restarting a Job or a
# CronJob); create and update ConfigMaps in reloader (its own record). Nothing outside these five namespaces.

# Short, fixed names (Deployment reloader, Roles reloader-role) instead of the release name twice.
fullnameOverride: reloader

# By digest (multi-arch index: linux/amd64 and linux/arm64), the chart's version beside it for the reader: a tag can be
# pushed again to other content, a digest cannot. The chart renders repository:tag when its digest key is empty, so tag
# holds version@digest; Renovate's helm-values manager updates both parts.
image:
  repository: ghcr.io/stakater/reloader
  tag: v1.4.23@sha256:82c80a15fdba22f738642553159f9fb37baf9e4d1edfeb798e8c48d87767f410

reloader:
  # The project's namespaces whose workloads read a rotated Secret, nothing else: Roles and RoleBindings there and in
  # reloader (the chart adds its own namespace) instead of a ClusterRole over the whole cluster.
  watchGlobally: false
  namespaces: [svp, svp-data, svp-obs, keda]
  # Secrets only: no workload here opts in by a ConfigMap, so the Roles grant no ConfigMap outside reloader.
  ignoreConfigMaps: true
  # A restart writes an annotation into the pod template, as kubectl rollout restart does. Argo CD's diff leaves a
  # field git never set alone, so the restarted workload stays Synced and selfHeal does not undo the restart.
  reloadStrategy: annotations
  # Only a change to an existing Secret restarts anything, so a restart of Reloader restarts nothing. v1.4.23 cannot
  # do both that and restart on a created Secret: it runs one Secret watcher per namespace above, and the first to
  # finish its initial list sets a flag all of them share, after which every Secret still in a slower watcher's
  # initial list counts as created and restarts the workloads that name it (internal/pkg/controller/controller.go,
  # secretControllerInitialized). The cost: a Secret created after its workload started restarts nobody. Today that
  # is only svp/sentry, which glitchtip-init.sh writes once the services run and which they read as optional: a
  # service started before it reports no errors until it restarts, by the operator's hand (kubectl rollout restart),
  # at its next rollout, or when the Secret changes again.
  # Revisit when Reloader v2 is a stable release: it takes a create only for a Secret made after the controller
  # started (creationTimestamp), so reloadOnCreate can be true again.
  reloadOnCreate: false
  syncAfterRestart: false
  # The releases gateway and web are Rollouts; each also sets reloader.stakater.com/rollout-strategy: restart, so a
  # restart sets spec.restartAt and makes no new revision (no canary for a credential). The chart grants the rule on
  # rollouts only when the cluster serves argoproj.io/v1alpha1, whose CRD Argo Rollouts brings in the same wave: on a
  # new cluster Argo CD may render this chart before that CRD exists, and adds the rule at its next refresh of the
  # Application (timeout.reconciliation 60s, base/argo-cd.yaml), before the Rollouts themselves exist (wave 7).
  isArgoRollouts: true
  # Pod Security "restricted": the chart's pod already runs as 65534, non-root, with seccomp RuntimeDefault; this
  # adds a read-only root (with an emptyDir at /tmp) and the container settings below.
  readOnlyRootFileSystem: true
  deployment:
    labels:
      # The controller watches Secrets and patches workloads through the API server: allow-kube-api of chart
      # svp-cluster opens that egress only for pods with this label.
      svp-kube-api: allow
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 128Mi}
