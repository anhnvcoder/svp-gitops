# cert-manager v1.21.2 (chart https://charts.jetstack.io), release cert-manager in namespace cert-manager.
# Design notes: docs/components.md.

# The chart installs no CRDs unless asked; the issuers and certificates of chart svp-cluster need them.
crds:
  enabled: true

global:
  leaderElection:
    # The default kube-system would make the chart render two Roles and RoleBindings there; the leader election Lease
    # stays in the chart's own namespace instead.
    namespace: cert-manager

# RBAC: the chart's, unchanged, an exception to the rule that no workload outside the control plane reads Secrets
# outside its own namespace.

# In every namespace the controller reads and writes Secrets (the key pair of each Certificate, the CA of each issuer)
# and creates the ACME HTTP-01 solver's pods, Services, Ingresses and HTTPRoutes; cainjector reads Secrets and updates
# every webhook configuration, APIService and CustomResourceDefinition (it writes a CA into them).

# Why it stays: the Certificates are in several namespaces and the controller writes each key pair into its
# Certificate's namespace; v1.21.2 has no namespaced RBAC, and --namespace turns ClusterIssuers off, which
# svp-selfsigned, svp-ca (lab) and svp-acme (EKS) are.

# On a lab cluster the ACME rights are unused (its issuers are a local CA); on EKS svp-acme solves DNS-01, which needs
# none of the HTTP-01 solver's pod, Service, Ingress or HTTPRoute rights either. The chart cannot drop them alone, and
# with Secrets of every namespace readable that would not change what a stolen token reads.

# What limits it instead: no route of Gateway svp leads to its pods, and a pod it creates is held to Pod Security
# restricted in every namespace that carries the label. A lab cluster defaults namespaces without it to restricted
# (deploy/k8s/pod-security-admission.yaml), kube-system exempt; EKS does not, so a stolen controller token can still
# start a privileged pod in kube-system, default, kube-public or kube-node-lease, root on the node.

# Images by digest (multi-arch index: linux/amd64 and linux/arm64), the chart's own tag beside it for the reader: a tag
# can be pushed again to other content, a digest cannot. The chart renders repository:tag, so tag holds version@digest;
# pin_check of deploy/ci/gitops-check.sh fails on an image without one. repository is the chart's default written out:
# Renovate's helm-values manager finds a pin only as repository and tag under a key ending in "image".
image:
  repository: quay.io/jetstack/cert-manager-controller
  tag: v1.21.2@sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
webhook:
  image:
    repository: quay.io/jetstack/cert-manager-webhook
    tag: v1.21.2@sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
cainjector:
  image:
    repository: quay.io/jetstack/cert-manager-cainjector
    tag: v1.21.2@sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
# The ACME HTTP-01 solver image the controller would start pods from (--acme-http01-solver-image); no issuer here
# solves HTTP-01 (svp-acme on EKS solves DNS-01).
acmesolver:
  image:
    repository: quay.io/jetstack/cert-manager-acmesolver
    tag: v1.21.2@sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503
# Job hook of the chart that waits for the webhook after an install.
startupapicheck:
  image:
    repository: quay.io/jetstack/cert-manager-startupapicheck
    tag: v1.21.2@sha256:46e75b6866359ffb5d82624f41e3ed1c70b2994982702ced547ce5edb418a8f5
